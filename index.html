<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Plant Tracker Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --ink: #27241F;
    --gold: #BD8B3A;
    --cream: #EDDDCA;
    --green: #3F6B4A;
    --watered: #4FC3F7;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: 14px 20px;
    background: var(--ink);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    position: relative;
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    font-weight: 600;
  }
  header .sub {
    font-size: 0.78rem;
    opacity: 0.75;
    margin-top: 2px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #refreshBtn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  #refreshBtn:hover { opacity: 0.9; }
  #refreshBtn:active { transform: scale(0.97); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-size: 0.75rem;
    color: var(--cream);
    opacity: 0.7;
    min-width: 140px;
    text-align: right;
  }
  #searchBox {
    padding: 7px 12px;
    border-radius: 6px;
    border: none;
    font-size: 0.85rem;
    width: 150px;
    background: rgba(255,255,255,0.95);
  }
  #searchBox:focus {
    outline: 2px solid var(--gold);
  }
  #searchBtn {
    background: transparent;
    border: 1px solid rgba(237,221,202,0.4);
    color: var(--cream);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #searchBtn:hover { background: rgba(237,221,202,0.1); }
  #searchMsg {
    font-size: 0.72rem;
    color: #ffb3a3;
    margin-top: 3px;
    display: none;
  }
  #map {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
  }
  .legend {
    position: absolute;
    bottom: 24px;
    left: 12px;
    z-index: 500;
    background: rgba(255,255,255,0.95);
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    font-size: 0.78rem;
    line-height: 1.6;
  }
  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .legend-toggle {
    display: none;
  }
  .legend-body {
    display: block;
  }
  .leaflet-control-layers {
    font-size: 0.85rem;
  }
  .leaflet-popup-content {
    font-family: inherit;
    min-width: 220px;
  }
  .popup-title {
    font-weight: 700;
    font-size: 1rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .popup-row {
    font-size: 0.82rem;
    color: #444;
    margin: 2px 0;
  }
  .popup-photo {
    width: 100%;
    max-width: 220px;
    height: 130px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 6px;
    display: block;
    background: #eee;
  }
  .popup-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge-watered { background: #DCEBF7; color: var(--watered); }
  .badge-notwatered { background: #eee; color: #888; }
  #errorBanner {
    display: none;
    background: #B14A3E;
    color: white;
    padding: 10px 20px;
    font-size: 0.85rem;
  }
  #emptyState {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: #777;
    font-size: 0.9rem;
    background: var(--cream);
    text-align: center;
    padding: 0 20px;
  }

  @media (max-width: 680px) {
    header {
      padding: 8px 12px;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
    }
    header h1 {
      font-size: 0.92rem;
      white-space: nowrap;
    }
    header .sub {
      font-size: 0.68rem;
    }
    .controls {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      width: auto;
    }
    #status {
      display: none; /* hidden on mobile to save space; still shown via toast on refresh */
    }
    .icon-btn {
      display: flex !important;
      background: rgba(237,221,202,0.12);
      border: 1px solid rgba(237,221,202,0.3);
      color: var(--cream);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      font-size: 1rem;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    #refreshBtn {
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #refreshBtn .btn-label { display: none; }
    .search-wrap {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--ink);
      padding: 10px 12px;
      gap: 8px;
      z-index: 900;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .search-wrap.open {
      display: flex;
    }
    #searchBox {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px; /* prevents iOS auto-zoom on focus */
      padding: 10px 12px;
      flex: 1;
    }
    #searchBtn {
      padding: 10px 14px;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    #searchMsg {
      position: absolute;
      top: 100%;
      left: 12px;
      margin-top: 2px;
    }

    /* Collapsible legend */
    .legend {
      bottom: 10px;
      left: 10px;
      right: auto;
      max-width: none;
      font-size: 0.75rem;
      padding: 0;
      max-height: none;
      overflow: visible;
      background: transparent;
      box-shadow: none;
    }
    .legend-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      width: fit-content;
    }
    .legend-body {
      display: none;
      background: rgba(255,255,255,0.97);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      margin-top: 6px;
      max-height: 32vh;
      overflow-y: auto;
      max-width: 200px;
    }
    .legend-body.open {
      display: block;
    }

    .leaflet-control-layers {
      font-size: 0.78rem;
    }
    .popup-photo {
      max-width: 160px;
      height: 100px;
    }
    .leaflet-popup-content {
      min-width: 160px;
    }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>🌲 Plant Tracker Map</h1>
      <div class="sub" id="countLabel">Loading plant data…</div>
    </div>
    <div class="controls">
      <span id="status"></span>
      <button id="searchToggleBtn" class="icon-btn" style="display:none;" aria-label="Search">🔍</button>
      <button id="refreshBtn"><span class="btn-icon">↻</span> <span class="btn-label">Refresh from Sheet</span></button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="searchBox" type="text" placeholder="Jump to Plant ID…" list="plantIdList" />
      <datalist id="plantIdList"></datalist>
      <button id="searchBtn">🔍 Go</button>
      <div id="searchMsg">Not found</div>
    </div>
  </header>
  <div id="errorBanner"></div>
  <div style="position:relative; flex:1 1 auto; min-height:0;">
    <div id="map"></div>
    <div id="emptyState">
      <div>No plant locations found yet.</div>
      <div>Add Latitude/Longitude values to your Plants tab, then hit Refresh.</div>
    </div>
    <div class="legend" id="legend">
      <div class="legend-toggle" id="legendToggle">
        <span>🌱 Category</span><span id="legendChevron">▾</span>
      </div>
      <div class="legend-body" id="legendBody">
        <div id="legendCategories">Loading…</div>
        <div style="margin-top:6px; padding-top:6px; border-top:1px solid #ddd;">
          <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#999; border:3px solid #4FC3F7; margin-right:6px; vertical-align:middle;"></span>Blue ring = watered
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SHEET_ID = "1X7c9lEhgSaz3_jf980HD9RmfvFkQ86_3KnKX9nvwdd4";
const SHEET_GID = "0"; // Plants tab
const GROWTH_GID = "2"; // Growth Summary tab

let map = L.map('map', { zoomControl: true });
let markersLayer = L.layerGroup().addTo(map);
let hasFitOnce = false;
let markersById = {};

// Base layers: street map + satellite imagery
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 21
});

const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics',
  maxZoom: 20
});

// Optional labels overlay for satellite view (roads/place names)
const satelliteLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 20,
  pane: 'shadowPane'
});

satelliteLayer.addTo(map); // default to satellite for a Google-Earth-style view

const isMobile = window.matchMedia('(max-width: 680px)').matches;

L.control.layers(
  { 'Satellite': satelliteLayer, 'Street map': streetLayer },
  { 'Roads & labels (satellite)': satelliteLabels },
  { position: 'topright', collapsed: isMobile }
).addTo(map);

map.setView([45.2901, -122.7372], 18); // fallback center, refit happens on data load

window.addEventListener('load', () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));

function findKey(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const hit = keys.find(k => k.trim().toLowerCase() === c);
    if (hit) return hit;
  }
  // fallback: partial match
  for (const c of candidates) {
    const hit = keys.find(k => k.trim().toLowerCase().includes(c));
    if (hit) return hit;
  }
  return null;
}

function parseBool(val) {
  if (!val) return false;
  const v = String(val).trim().toLowerCase();
  return v === 'yes' || v === 'true' || v === 'y' || v === '1';
}

const CATEGORY_COLORS = {
  'SQ': '#B14A3E', // redwood-ish red
  'GF': '#3F6B4A', // green - grand fir
  'DF': '#6B4F9E', // purple - douglas fir
  'IC': '#C77D2E', // orange - incense cedar
  'P':  '#2E7DAF', // blue - pine
};
const FALLBACK_COLOR = '#7A7266';

function getCategory(id) {
  const match = String(id).trim().match(/^([A-Za-z]+)-?\d*/);
  return match ? match[1].toUpperCase() : 'OTHER';
}

function getCategoryColor(cat) {
  return CATEGORY_COLORS[cat] || FALLBACK_COLOR;
}

function buildIcon(category, watered) {
  const fill = getCategoryColor(category);
  const ringColor = watered ? '#4FC3F7' : 'white';
  const ringWidth = watered ? 4 : 3;
  return L.divIcon({
    className: '',
    html: `<div style="
      width:16px;height:16px;border-radius:50%;
      background:${fill};
      border:${ringWidth}px solid ${ringColor};
      box-shadow:0 1px 4px rgba(0,0,0,0.5);
    "></div>`,
    iconSize: [16 + ringWidth*2, 16 + ringWidth*2],
    iconAnchor: [(16 + ringWidth*2)/2, (16 + ringWidth*2)/2],
    popupAnchor: [0, -(16 + ringWidth*2)/2]
  });
}

function updateLegend(categoriesSeen, categoryLabels) {
  const el = document.getElementById('legendCategories');
  if (!categoriesSeen.size) {
    el.textContent = 'No plants yet';
    return;
  }
  el.innerHTML = Array.from(categoriesSeen).sort().map(cat => `
    <div><span class="legend-dot" style="background:${getCategoryColor(cat)};"></span>${categoryLabels[cat] || cat}</div>
  `).join('');
}

let jsonpCallbackCounter = 0;

function fetchSheetViaJSONP(gid) {
  return new Promise((resolve, reject) => {
    const callbackName = 'sheetCallback_' + (jsonpCallbackCounter++);
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out — check the Sheet ID and that sharing is set to "Anyone with the link can view".'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeoutId);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(json) {
      cleanup();
      try {
        const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
        const rows = json.table.rows.map(r => {
          const obj = {};
          r.c.forEach((cell, i) => {
            obj[cols[i]] = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : '';
          });
          return obj;
        });
        resolve(rows);
      } catch (e) {
        reject(new Error('Unexpected response format from Sheets.'));
      }
    };

    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
      `tqx=out:json;responseHandler:${callbackName}` +
      `&gid=${gid}` +
      `&_cb=${Date.now()}`;

    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => {
      cleanup();
      reject(new Error('Could not reach Google Sheets. Check the Sheet ID and sharing settings.'));
    };
    document.body.appendChild(script);
  });
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('status');
  const errorBanner = document.getElementById('errorBanner');
  const emptyState = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');

  btn.disabled = true;
  btn.textContent = '↻ Refreshing…';
  errorBanner.style.display = 'none';
  emptyState.style.display = 'none';

  try {
    const [rows, growthRows] = await Promise.all([
      fetchSheetViaJSONP(SHEET_GID),
      fetchSheetViaJSONP(GROWTH_GID).catch(err => {
        console.warn('Growth Summary fetch failed, continuing without it:', err);
        return [];
      })
    ]);

    // Build a lookup: Plant ID -> growth stats
    const growthById = {};
    if (growthRows.length) {
      const gSample = growthRows[0];
      const gIdKey = findKey(gSample, ['plant id', 'id']);
      const firstHeightKey = findKey(gSample, ['first height']);
      const latestHeightKey = findKey(gSample, ['latest height']);
      const totalGrowthKey = findKey(gSample, ['total growth']);
      const latestDateKey = findKey(gSample, ['latest measurement date', 'latest date']);

      growthRows.forEach(r => {
        const pid = gIdKey ? String(r[gIdKey] || '').trim() : null;
        if (!pid) return;
        growthById[pid] = {
          firstHeight: firstHeightKey ? r[firstHeightKey] : '',
          latestHeight: latestHeightKey ? r[latestHeightKey] : '',
          totalGrowth: totalGrowthKey ? r[totalGrowthKey] : '',
          latestDate: latestDateKey ? r[latestDateKey] : ''
        };
      });
    }

    markersLayer.clearLayers();

    if (!rows.length) {
      emptyState.style.display = 'flex';
      countLabel.textContent = 'No rows found in sheet.';
      statusEl.textContent = 'Last checked ' + new Date().toLocaleTimeString();
      return;
    }

    const sample = rows[0];
    const idKey = findKey(sample, ['plant id', 'id']);
    const latKey = findKey(sample, ['latitude', 'lat']);
    const lonKey = findKey(sample, ['longitude', 'long', 'lng']);
    const speciesKey = findKey(sample, ['species']);
    const commonKey = findKey(sample, ['common name']);
    const statusKey = findKey(sample, ['status']);
    const notesKey = findKey(sample, ['location notes', 'notes']);
    const wateredKey = findKey(sample, ['watered']);
    const photoKey = findKey(sample, ['photo url', 'photo', 'image url', 'image']);

    const bounds = [];
    let plotted = 0;
    const categoriesSeen = new Set();
    const categoryLabels = {};
    markersById = {};

    rows.forEach(row => {
      const latRaw = latKey ? row[latKey] : null;
      const lonRaw = lonKey ? row[lonKey] : null;
      const lat = parseFloat(latRaw);
      const lon = parseFloat(lonRaw);
      if (isNaN(lat) || isNaN(lon)) return;

      const id = idKey ? (row[idKey] || 'Unnamed') : 'Unnamed';
      const species = speciesKey ? row[speciesKey] : '';
      const common = commonKey ? row[commonKey] : '';
      const status = statusKey ? row[statusKey] : '';
      const notes = notesKey ? row[notesKey] : '';
      const watered = wateredKey ? parseBool(row[wateredKey]) : false;
      const photoUrl = photoKey ? row[photoKey] : '';
      const growth = growthById[String(id).trim()];
      const category = getCategory(id);
      categoriesSeen.add(category);
      if (common && !categoryLabels[category]) {
        categoryLabels[category] = common;
      }

      const marker = L.marker([lat, lon], { icon: buildIcon(category, watered) });

      const growthHtml = growth && (growth.firstHeight || growth.latestHeight) ? `
        <div class="popup-row" style="margin-top:6px; padding-top:6px; border-top:1px solid #eee;">
          <strong>Growth:</strong>
          ${growth.firstHeight !== '' ? `Start: ${growth.firstHeight}"` : ''}
          ${growth.latestHeight !== '' ? ` → Now: ${growth.latestHeight}"` : ''}
          ${growth.totalGrowth !== '' ? ` (+${growth.totalGrowth}")` : ''}
        </div>
        ${growth.latestDate ? `<div class="popup-row" style="font-size:0.72rem; color:#888;">Last measured: ${growth.latestDate}</div>` : ''}
      ` : '';

      const popupHtml = `
        ${photoUrl ? `<img class="popup-photo" src="${photoUrl}" alt="${id}" onerror="this.style.display='none'">` : ''}
        <div class="popup-title">${id}</div>
        ${common || species ? `<div class="popup-row">${common ? `<strong>${common}</strong>` : ''}${species ? `<br><em style="font-size:0.78rem; color:#666;">${species}</em>` : ''}</div>` : ''}
        ${status ? `<div class="popup-row">Status: ${status}</div>` : ''}
        ${notes ? `<div class="popup-row">${notes}</div>` : ''}
        ${wateredKey ? `<span class="popup-badge ${watered ? 'badge-watered' : 'badge-notwatered'}">${watered ? '💧 Watered' : 'Not watered'}</span>` : ''}
        ${growthHtml}
      `;
      marker.bindPopup(popupHtml);
      markersLayer.addLayer(marker);
      markersById[String(id).trim().toLowerCase()] = marker;
      bounds.push([lat, lon]);
      plotted++;
    });

    if (plotted === 0) {
      emptyState.style.display = 'flex';
      countLabel.textContent = `${rows.length} row(s) in sheet, but none have valid coordinates yet.`;
    } else {
      countLabel.textContent = `${plotted} plant${plotted === 1 ? '' : 's'} plotted`;
      if (!hasFitOnce || plotted <= 40) {
        map.fitBounds(bounds, { padding: [40,40], maxZoom: 20 });
        hasFitOnce = true;
      }
    }

    updateLegend(categoriesSeen, categoryLabels);

    const datalist = document.getElementById('plantIdList');
    datalist.innerHTML = Object.keys(markersById)
      .sort()
      .map(k => `<option value="${k.toUpperCase()}">`)
      .join('');

    statusEl.textContent = 'Last updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    console.error(err);
    errorBanner.style.display = 'block';
    errorBanner.textContent = 'Could not load sheet data: ' + err.message;
    statusEl.textContent = 'Load failed';
  } finally {
    btn.disabled = false;
    btn.textContent = '↻ Refresh from Sheet';
  }
}

function jumpToPlant() {
  const input = document.getElementById('searchBox');
  const msg = document.getElementById('searchMsg');
  const query = input.value.trim().toLowerCase();
  msg.style.display = 'none';

  if (!query) return;

  let marker = markersById[query];
  if (!marker) {
    // partial match fallback
    const key = Object.keys(markersById).find(k => k.includes(query));
    if (key) marker = markersById[key];
  }

  if (marker) {
    map.setView(marker.getLatLng(), Math.max(map.getZoom(), 20), { animate: true });
    marker.openPopup();
    msg.style.display = 'none';
  } else {
    msg.textContent = `"${input.value}" not found`;
    msg.style.display = 'block';
  }
}

document.getElementById('searchBtn').addEventListener('click', jumpToPlant);
document.getElementById('searchBox').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') jumpToPlant();
});

// Mobile search toggle
const searchToggleBtn = document.getElementById('searchToggleBtn');
const searchWrap = document.getElementById('searchWrap');
if (searchToggleBtn) {
  searchToggleBtn.addEventListener('click', () => {
    searchWrap.classList.toggle('open');
    if (searchWrap.classList.contains('open')) {
      document.getElementById('searchBox').focus();
    }
  });
}

// Collapsible legend (mobile)
const legendToggle = document.getElementById('legendToggle');
const legendBody = document.getElementById('legendBody');
const legendChevron = document.getElementById('legendChevron');
if (legendToggle) {
  legendToggle.addEventListener('click', () => {
    legendBody.classList.toggle('open');
    legendChevron.textContent = legendBody.classList.contains('open') ? '▴' : '▾';
  });
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
loadData();
</script>
</body>
