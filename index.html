<title>Plant Tracker Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --ink: #27241F;
    --gold: #BD8B3A;
    --cream: #EDDDCA;
    --green: #3F6B4A;
    --watered: #4FC3F7;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--ink);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  #splashScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #33302A 0%, var(--ink) 70%);
    z-index: 5000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #splashScreen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .splash-icon {
    font-size: 3.2rem;
    animation: splashPulse 1.8s ease-in-out infinite;
  }
  .splash-title {
    font-family: var(--font-display);
    color: var(--cream);
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .splash-sub {
    color: var(--gold);
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    opacity: 0.9;
  }
  .splash-bar-track {
    width: 160px;
    height: 3px;
    background: rgba(237,221,202,0.15);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .splash-bar-fill {
    width: 40%;
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    animation: splashLoading 1.3s ease-in-out infinite;
  }
  @keyframes splashPulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  @keyframes splashLoading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  header {
    padding: 14px 20px;
    background: var(--ink);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    position: relative;
  }
  header h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-optical-sizing: auto;
    letter-spacing: 0.01em;
    font-weight: 600;
  }
  header .sub {
    font-size: 0.78rem;
    opacity: 0.75;
    margin-top: 2px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #refreshBtn {
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  #refreshBtn:hover { opacity: 0.9; }
  #refreshBtn:active { transform: scale(0.97); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-size: 0.75rem;
    color: var(--cream);
    opacity: 0.7;
    min-width: 140px;
    text-align: right;
  }
  #searchBox {
    padding: 7px 12px;
    border-radius: 6px;
    border: none;
    font-size: 0.85rem;
    width: 150px;
    background: rgba(255,255,255,0.95);
  }
  #searchBox:focus {
    outline: 2px solid var(--gold);
  }
  #searchBtn {
    background: transparent;
    border: 1px solid rgba(237,221,202,0.4);
    color: var(--cream);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #searchBtn:hover { background: rgba(237,221,202,0.1); }
  #searchMsg {
    font-size: 0.72rem;
    color: #ffb3a3;
    margin-top: 3px;
    display: none;
  }
  #map {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
  }
  .legend {
    position: absolute;
    bottom: 24px;
    left: 12px;
    z-index: 500;
    background: rgba(255,255,255,0.95);
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    font-size: 0.78rem;
    line-height: 1.6;
  }
  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .legend-toggle {
    display: none;
  }
  .legend-body {
    display: block;
  }
  .leaflet-control-layers {
    font-size: 0.85rem;
  }
  .leaflet-popup-content {
    font-family: inherit;
    min-width: 220px;
  }
  .popup-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .popup-row {
    font-size: 0.82rem;
    color: #444;
    margin: 2px 0;
  }
  .popup-photo {
    width: 100%;
    max-width: 220px;
    height: 130px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 6px;
    display: block;
    background: #eee;
  }
  .popup-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge-watered { background: #DCEBF7; color: var(--watered); }
  .badge-notwatered { background: #eee; color: #888; }
  #errorBanner {
    display: none;
    background: #B14A3E;
    color: white;
    padding: 10px 20px;
    font-size: 0.85rem;
  }
  .gallery-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 7px 10px;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .gallery-btn:hover { opacity: 0.9; }

  #galleryModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #galleryModal.open { display: flex; }
  .gallery-panel {
    background: var(--cream);
    border-radius: 12px;
    max-width: 700px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
  }
  .gallery-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--ink);
    color: var(--cream);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
  }
  .gallery-title {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .gallery-sub {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 14px;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .gallery-thumb-wrap {
    cursor: pointer;
    border: 3px solid transparent;
    border-radius: 8px;
    overflow: hidden;
    background: white;
    transition: border-color 0.15s ease;
  }
  .gallery-thumb-wrap.selected {
    border-color: var(--gold);
  }
  .gallery-thumb {
    width: 100%;
    height: 90px;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .gallery-thumb-label {
    font-size: 0.68rem;
    padding: 4px 6px;
    color: #444;
    line-height: 1.3;
  }
  .gallery-hint {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 10px;
  }
  .gallery-compare {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 10px;
    padding-top: 14px;
    border-top: 1px solid #ddd;
  }
  .gallery-compare.open { display: grid; }
  .gallery-compare img {
    width: 100%;
    border-radius: 8px;
    display: block;
    background: #eee;
  }
  .gallery-compare-label {
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 6px;
    color: var(--ink);
    text-align: center;
  }
  .gallery-empty {
    font-size: 0.85rem;
    color: #888;
    padding: 20px 0;
    text-align: center;
  }

  /* Mobile bottom sheet */
  #sheetBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1400;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  #sheetBackdrop.open {
    opacity: 1;
    visibility: visible;
  }
  #bottomSheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--cream);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.3);
    z-index: 1500;
    max-height: 75vh;
    overflow-y: auto;
    padding: 10px 18px 24px;
    box-sizing: border-box;
    transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #bottomSheet.open {
    transform: translateY(0);
  }
  .sheet-handle {
    width: 40px;
    height: 4px;
    background: #c9bda8;
    border-radius: 2px;
    margin: 4px auto 12px;
  }
  .sheet-close-btn {
    position: absolute;
    top: 12px;
    right: 14px;
    background: rgba(39,36,31,0.08);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
  }
  #sheetContent .popup-photo {
    max-width: 100%;
    height: 180px;
  }
  #sheetContent .leaflet-popup-content {
    min-width: 0;
  }
  #emptyState {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: #777;
    font-size: 0.9rem;
    background: var(--cream);
    text-align: center;
    padding: 0 20px;
  }

  @media (max-width: 680px) {
    header {
      padding: 8px 12px;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
    }
    header h1 {
      font-size: 0.92rem;
      white-space: nowrap;
    }
    header .sub {
      font-size: 0.68rem;
    }
    .controls {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      width: auto;
    }
    #status {
      display: none; /* hidden on mobile to save space; still shown via toast on refresh */
    }
    .icon-btn {
      display: flex !important;
      background: rgba(237,221,202,0.12);
      border: 1px solid rgba(237,221,202,0.3);
      color: var(--cream);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      font-size: 1rem;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    #refreshBtn {
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #refreshBtn .btn-label { display: none; }
    .search-wrap {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--ink);
      padding: 10px 12px;
      gap: 8px;
      z-index: 900;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .search-wrap.open {
      display: flex;
    }
    #searchBox {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px; /* prevents iOS auto-zoom on focus */
      padding: 10px 12px;
      flex: 1;
    }
    #searchBtn {
      padding: 10px 14px;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    #searchMsg {
      position: absolute;
      top: 100%;
      left: 12px;
      margin-top: 2px;
    }

    /* Collapsible legend */
    .legend {
      bottom: 10px;
      left: 10px;
      right: auto;
      max-width: none;
      font-size: 0.75rem;
      padding: 0;
      max-height: none;
      overflow: visible;
      background: transparent;
      box-shadow: none;
    }
    .legend-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      width: fit-content;
    }
    .legend-body {
      display: none;
      background: rgba(255,255,255,0.97);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      margin-top: 6px;
      max-height: 32vh;
      overflow-y: auto;
      max-width: 200px;
    }
    .legend-body.open {
      display: block;
    }

    .leaflet-control-layers {
      font-size: 0.78rem;
    }
    .popup-photo {
      max-width: 160px;
      height: 100px;
    }
    .leaflet-popup-content {
      min-width: 160px;
    }
  }
</style>
</head>
<body>
<div id="splashScreen">
  <div class="splash-icon">🌲</div>
  <div class="splash-title">Plant Tracker</div>
  <div class="splash-sub">Loading your grove…</div>
  <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
</div>
<div id="app">
  <header>
    <div>
      <h1>🌲 Plant Tracker Map</h1>
      <div class="sub" id="countLabel">Loading plant data…</div>
    </div>
    <div class="controls">
      <span id="status"></span>
      <button id="searchToggleBtn" class="icon-btn" style="display:none;" aria-label="Search">🔍</button>
      <button id="refreshBtn"><span class="btn-icon">↻</span> <span class="btn-label">Refresh from Sheet</span></button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="searchBox" type="text" placeholder="Jump to Plant ID…" list="plantIdList" />
      <datalist id="plantIdList"></datalist>
      <button id="searchBtn">🔍 Go</button>
      <div id="searchMsg">Not found</div>
    </div>
  </header>
  <div id="errorBanner"></div>
  <div style="position:relative; flex:1 1 auto; min-height:0;">
    <div id="map"></div>
    <div id="emptyState">
      <div>No plant locations found yet.</div>
      <div>Add Latitude/Longitude values to your Plants tab, then hit Refresh.</div>
    </div>
    <div class="legend" id="legend">
      <div class="legend-toggle" id="legendToggle">
        <span>🌱 Category</span><span id="legendChevron">▾</span>
      </div>
      <div class="legend-body" id="legendBody">
        <div id="legendCategories">Loading…</div>
        <div style="margin-top:6px; padding-top:6px; border-top:1px solid #ddd;">
          <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#999; border:3px solid #4FC3F7; margin-right:6px; vertical-align:middle;"></span>Blue ring = watered
        </div>
      </div>
    </div>
  </div>
</div>

<div id="galleryModal">
  <div class="gallery-panel">
    <button class="gallery-close" id="galleryCloseBtn">✕</button>
    <div class="gallery-title" id="galleryTitle">Plant</div>
    <div class="gallery-sub" id="gallerySub"></div>
    <div class="gallery-hint">Tap two photos to compare them side by side.</div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="gallery-compare" id="galleryCompare"></div>
  </div>
</div>

<div id="sheetBackdrop"></div>
<div id="bottomSheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <button class="sheet-close-btn" id="sheetCloseBtn">✕</button>
  <div id="sheetContent"></div>
</div>

<script>
const SHEET_ID = "1X7c9lEhgSaz3_jf980HD9RmfvFkQ86_3KnKX9nvwdd4";
const SHEET_GID = "0"; // Plants tab
const GROWTH_GID = "2"; // Growth Summary tab
const MEASUREMENTS_GID = "1"; // Measurements tab

let plantFallbackPhotoById = {};
let measurementsById = {}; // Plant ID -> array of {date, height, photoUrl, notes} sorted ascending

let map = L.map('map', { zoomControl: true });
let markersLayer = L.layerGroup().addTo(map);
let hasFitOnce = false;
let markersById = {};

// Base layers: street map + satellite imagery
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 21
});

const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics',
  maxZoom: 20
});

// Optional labels overlay for satellite view (roads/place names)
const satelliteLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 20,
  pane: 'shadowPane'
});

satelliteLayer.addTo(map); // default to satellite for a Google-Earth-style view

const isMobile = window.matchMedia('(max-width: 680px)').matches;

L.control.layers(
  { 'Satellite': satelliteLayer, 'Street map': streetLayer },
  { 'Roads & labels (satellite)': satelliteLabels },
  { position: 'topright', collapsed: isMobile }
).addTo(map);

map.setView([45.2901, -122.7372], 18); // fallback center, refit happens on data load

window.addEventListener('load', () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));

function findKey(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const hit = keys.find(k => k.trim().toLowerCase() === c);
    if (hit) return hit;
  }
  // fallback: partial match
  for (const c of candidates) {
    const hit = keys.find(k => k.trim().toLowerCase().includes(c));
    if (hit) return hit;
  }
  return null;
}

function parseBool(val) {
  if (!val) return false;
  const v = String(val).trim().toLowerCase();
  return v === 'yes' || v === 'true' || v === 'y' || v === '1';
}

const CATEGORY_COLORS = {
  'SQ': '#B14A3E', // redwood-ish red
  'GF': '#3F6B4A', // green - grand fir
  'DF': '#6B4F9E', // purple - douglas fir
  'IC': '#C77D2E', // orange - incense cedar
  'P':  '#2E7DAF', // blue - pine
};
const FALLBACK_COLOR = '#7A7266';

function getCategory(id) {
  const match = String(id).trim().match(/^([A-Za-z]+)-?\d*/);
  return match ? match[1].toUpperCase() : 'OTHER';
}

function getCategoryColor(cat) {
  return CATEGORY_COLORS[cat] || FALLBACK_COLOR;
}

function buildIcon(category, watered) {
  const fill = getCategoryColor(category);
  const ringColor = watered ? '#4FC3F7' : 'white';
  const ringWidth = watered ? 4 : 3;
  return L.divIcon({
    className: '',
    html: `<div style="
      width:16px;height:16px;border-radius:50%;
      background:${fill};
      border:${ringWidth}px solid ${ringColor};
      box-shadow:0 1px 4px rgba(0,0,0,0.5);
    "></div>`,
    iconSize: [16 + ringWidth*2, 16 + ringWidth*2],
    iconAnchor: [(16 + ringWidth*2)/2, (16 + ringWidth*2)/2],
    popupAnchor: [0, -(16 + ringWidth*2)/2]
  });
}

function updateLegend(categoriesSeen, categoryLabels) {
  const el = document.getElementById('legendCategories');
  if (!categoriesSeen.size) {
    el.textContent = 'No plants yet';
    return;
  }
  el.innerHTML = Array.from(categoriesSeen).sort().map(cat => `
    <div><span class="legend-dot" style="background:${getCategoryColor(cat)};"></span>${categoryLabels[cat] || cat}</div>
  `).join('');
}

let jsonpCallbackCounter = 0;

function fetchSheetViaJSONP(gid) {
  return new Promise((resolve, reject) => {
    const callbackName = 'sheetCallback_' + (jsonpCallbackCounter++);
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error('Request timed out — check the Sheet ID and that sharing is set to "Anyone with the link can view".'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeoutId);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(json) {
      cleanup();
      try {
        const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
        const rows = json.table.rows.map(r => {
          const obj = {};
          r.c.forEach((cell, i) => {
            obj[cols[i]] = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : '';
          });
          return obj;
        });
        resolve(rows);
      } catch (e) {
        reject(new Error('Unexpected response format from Sheets.'));
      }
    };

    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
      `tqx=out:json;responseHandler:${callbackName}` +
      `&gid=${gid}` +
      `&_cb=${Date.now()}`;

    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => {
      cleanup();
      reject(new Error('Could not reach Google Sheets. Check the Sheet ID and sharing settings.'));
    };
    document.body.appendChild(script);
  });
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('status');
  const errorBanner = document.getElementById('errorBanner');
  const emptyState = document.getElementById('emptyState');
  const countLabel = document.getElementById('countLabel');

  btn.disabled = true;
  btn.innerHTML = '<span class="btn-icon" style="display:inline-block; animation: spin 0.8s linear infinite;">↻</span> <span class="btn-label">Refreshing…</span>';
  errorBanner.style.display = 'none';
  emptyState.style.display = 'none';

  try {
    const [rows, growthRows, measRows] = await Promise.all([
      fetchSheetViaJSONP(SHEET_GID),
      fetchSheetViaJSONP(GROWTH_GID).catch(err => {
        console.warn('Growth Summary fetch failed, continuing without it:', err);
        return [];
      }),
      fetchSheetViaJSONP(MEASUREMENTS_GID).catch(err => {
        console.warn('Measurements fetch failed, continuing without it:', err);
        return [];
      })
    ]);

    // Build a lookup: Plant ID -> chronological measurement/photo history
    measurementsById = {};
    if (measRows.length) {
      const mSample = measRows[0];
      const mIdKey = findKey(mSample, ['plant id', 'id']);
      const mDateKey = findKey(mSample, ['date']);
      const mHeightKey = findKey(mSample, ['height']);
      const mPhotoKey = findKey(mSample, ['photo url', 'photo filename', 'photo', 'image url', 'image']);
      const mNotesKey = findKey(mSample, ['notes']);

      measRows.forEach(r => {
        const pid = mIdKey ? String(r[mIdKey] || '').trim() : null;
        if (!pid) return;
        if (!measurementsById[pid]) measurementsById[pid] = [];
        measurementsById[pid].push({
          date: mDateKey ? r[mDateKey] : '',
          height: mHeightKey ? r[mHeightKey] : '',
          photoUrl: mPhotoKey ? r[mPhotoKey] : '',
          notes: mNotesKey ? r[mNotesKey] : ''
        });
      });
      // sort each plant's entries chronologically
      Object.keys(measurementsById).forEach(pid => {
        measurementsById[pid].sort((a, b) => new Date(a.date) - new Date(b.date));
      });
    }

    // Build a lookup: Plant ID -> growth stats
    const growthById = {};
    if (growthRows.length) {
      const gSample = growthRows[0];
      const gIdKey = findKey(gSample, ['plant id', 'id']);
      const firstHeightKey = findKey(gSample, ['first height']);
      const latestHeightKey = findKey(gSample, ['latest height']);
      const totalGrowthKey = findKey(gSample, ['total growth']);
      const latestDateKey = findKey(gSample, ['latest measurement date', 'latest date']);

      growthRows.forEach(r => {
        const pid = gIdKey ? String(r[gIdKey] || '').trim() : null;
        if (!pid) return;
        growthById[pid] = {
          firstHeight: firstHeightKey ? r[firstHeightKey] : '',
          latestHeight: latestHeightKey ? r[latestHeightKey] : '',
          totalGrowth: totalGrowthKey ? r[totalGrowthKey] : '',
          latestDate: latestDateKey ? r[latestDateKey] : ''
        };
      });
    }

    markersLayer.clearLayers();

    if (!rows.length) {
      emptyState.style.display = 'flex';
      countLabel.textContent = 'No rows found in sheet.';
      statusEl.textContent = 'Last checked ' + new Date().toLocaleTimeString();
      return;
    }

    const sample = rows[0];
    const idKey = findKey(sample, ['plant id', 'id']);
    const latKey = findKey(sample, ['latitude', 'lat']);
    const lonKey = findKey(sample, ['longitude', 'long', 'lng']);
    const speciesKey = findKey(sample, ['species']);
    const commonKey = findKey(sample, ['common name']);
    const statusKey = findKey(sample, ['status']);
    const notesKey = findKey(sample, ['location notes', 'notes']);
    const wateredKey = findKey(sample, ['watered']);
    const photoKey = findKey(sample, ['photo url', 'photo', 'image url', 'image']);

    const bounds = [];
    let plotted = 0;
    const categoriesSeen = new Set();
    const categoryLabels = {};
    markersById = {};

    rows.forEach(row => {
      const latRaw = latKey ? row[latKey] : null;
      const lonRaw = lonKey ? row[lonKey] : null;
      const lat = parseFloat(latRaw);
      const lon = parseFloat(lonRaw);
      if (isNaN(lat) || isNaN(lon)) return;

      const id = idKey ? (row[idKey] || 'Unnamed') : 'Unnamed';
      const species = speciesKey ? row[speciesKey] : '';
      const common = commonKey ? row[commonKey] : '';
      const status = statusKey ? row[statusKey] : '';
      const notes = notesKey ? row[notesKey] : '';
      const watered = wateredKey ? parseBool(row[wateredKey]) : false;
      const photoUrl = photoKey ? row[photoKey] : '';
      const growth = growthById[String(id).trim()];
      const category = getCategory(id);
      categoriesSeen.add(category);
      if (common && !categoryLabels[category]) {
        categoryLabels[category] = common;
      }
      if (photoUrl) {
        plantFallbackPhotoById[String(id).trim()] = photoUrl;
      }

      const marker = L.marker([lat, lon], { icon: buildIcon(category, watered) });

      const growthHtml = growth && (growth.firstHeight || growth.latestHeight) ? `
        <div class="popup-row" style="margin-top:6px; padding-top:6px; border-top:1px solid #eee;">
          <strong>Growth:</strong>
          ${growth.firstHeight !== '' ? `Start: ${growth.firstHeight}"` : ''}
          ${growth.latestHeight !== '' ? ` → Now: ${growth.latestHeight}"` : ''}
          ${growth.totalGrowth !== '' ? ` (+${growth.totalGrowth}")` : ''}
        </div>
        ${growth.latestDate ? `<div class="popup-row" style="font-size:0.72rem; color:#888;">Last measured: ${growth.latestDate}</div>` : ''}
      ` : '';

      const popupHtml = `
        ${photoUrl ? `<img class="popup-photo" src="${photoUrl}" alt="${id}" onerror="this.style.display='none'">` : ''}
        <div class="popup-title">${id}</div>
        ${common || species ? `<div class="popup-row">${common ? `<strong style="font-family: var(--font-display); font-size:0.95rem; font-weight:600;">${common}</strong>` : ''}${species ? `<br><em style="font-size:0.78rem; color:#666;">${species}</em>` : ''}</div>` : ''}
        ${status ? `<div class="popup-row">Status: ${status}</div>` : ''}
        ${notes ? `<div class="popup-row">${notes}</div>` : ''}
        ${wateredKey ? `<span class="popup-badge ${watered ? 'badge-watered' : 'badge-notwatered'}">${watered ? '💧 Watered' : 'Not watered'}</span>` : ''}
        ${growthHtml}
        <button class="gallery-btn" onclick="openGallery('${String(id).trim().replace(/'/g, "\\'")}')">📷 View photo history</button>
      `;
      marker._popupHtml = popupHtml;
      if (isMobile) {
        marker.on('click', () => openBottomSheet(popupHtml));
      } else {
        marker.bindPopup(popupHtml);
      }
      markersLayer.addLayer(marker);
      markersById[String(id).trim().toLowerCase()] = marker;
      bounds.push([lat, lon]);
      plotted++;
    });

    if (plotted === 0) {
      emptyState.style.display = 'flex';
      countLabel.textContent = `${rows.length} row(s) in sheet, but none have valid coordinates yet.`;
    } else {
      countLabel.textContent = `${plotted} plant${plotted === 1 ? '' : 's'} plotted`;
      if (!hasFitOnce || plotted <= 40) {
        map.fitBounds(bounds, { padding: [40,40], maxZoom: 20 });
        hasFitOnce = true;
      }
    }

    updateLegend(categoriesSeen, categoryLabels);

    const datalist = document.getElementById('plantIdList');
    datalist.innerHTML = Object.keys(markersById)
      .sort()
      .map(k => `<option value="${k.toUpperCase()}">`)
      .join('');

    statusEl.textContent = 'Last updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    console.error(err);
    errorBanner.style.display = 'block';
    errorBanner.textContent = 'Could not load sheet data: ' + err.message;
    statusEl.textContent = 'Load failed';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="btn-icon">↻</span> <span class="btn-label">Refresh from Sheet</span>';
    const splash = document.getElementById('splashScreen');
    if (splash) splash.classList.add('hidden');
  }
}

function jumpToPlant() {
  const input = document.getElementById('searchBox');
  const msg = document.getElementById('searchMsg');
  const query = input.value.trim().toLowerCase();
  msg.style.display = 'none';

  if (!query) return;

  let marker = markersById[query];
  if (!marker) {
    // partial match fallback
    const key = Object.keys(markersById).find(k => k.includes(query));
    if (key) marker = markersById[key];
  }

  if (marker) {
    map.setView(marker.getLatLng(), Math.max(map.getZoom(), 20), { animate: true });
    if (isMobile) {
      openBottomSheet(marker._popupHtml);
    } else {
      marker.openPopup();
    }
    msg.style.display = 'none';
  } else {
    msg.textContent = `"${input.value}" not found`;
    msg.style.display = 'block';
  }
}

// ---- Photo history gallery ----
let gallerySelected = [];

function openGallery(plantId) {
  const modal = document.getElementById('galleryModal');
  const title = document.getElementById('galleryTitle');
  const sub = document.getElementById('gallerySub');
  const grid = document.getElementById('galleryGrid');
  const compare = document.getElementById('galleryCompare');

  gallerySelected = [];
  compare.classList.remove('open');
  compare.innerHTML = '';

  title.textContent = plantId;

  let history = measurementsById[plantId] || [];
  history = history.filter(h => h.photoUrl); // only entries with a photo

  // fallback: if no dated photos yet, show the single Plants-tab photo
  if (!history.length && plantFallbackPhotoById[plantId]) {
    history = [{ date: '', height: '', photoUrl: plantFallbackPhotoById[plantId], notes: 'Current photo' }];
  }

  if (!history.length) {
    sub.textContent = '';
    grid.innerHTML = '<div class="gallery-empty">No photos logged yet for this plant.</div>';
    modal.classList.add('open');
    return;
  }

  sub.textContent = `${history.length} photo${history.length === 1 ? '' : 's'} logged`;

  grid.innerHTML = history.map((h, i) => `
    <div class="gallery-thumb-wrap" data-index="${i}" onclick="toggleGallerySelect(${i})">
      <img class="gallery-thumb" src="${h.photoUrl}" onerror="this.style.opacity='0.2'">
      <div class="gallery-thumb-label">${h.date || ''}${h.height ? ` · ${h.height}"` : ''}</div>
    </div>
  `).join('');

  modal.dataset.history = JSON.stringify(history);
  modal.classList.add('open');
}

function toggleGallerySelect(index) {
  const modal = document.getElementById('galleryModal');
  const history = JSON.parse(modal.dataset.history || '[]');
  const wraps = document.querySelectorAll('.gallery-thumb-wrap');

  const pos = gallerySelected.indexOf(index);
  if (pos > -1) {
    gallerySelected.splice(pos, 1);
  } else {
    if (gallerySelected.length >= 2) gallerySelected.shift(); // keep max 2, drop oldest
    gallerySelected.push(index);
  }

  wraps.forEach(w => {
    const i = parseInt(w.dataset.index, 10);
    w.classList.toggle('selected', gallerySelected.includes(i));
  });

  const compare = document.getElementById('galleryCompare');
  if (gallerySelected.length === 2) {
    const sorted = [...gallerySelected].sort((a, b) => a - b);
    compare.innerHTML = sorted.map(i => {
      const h = history[i];
      return `
        <div>
          <img src="${h.photoUrl}">
          <div class="gallery-compare-label">${h.date || 'Photo'}${h.height ? ` · ${h.height}"` : ''}</div>
        </div>
      `;
    }).join('');
    compare.classList.add('open');
  } else {
    compare.classList.remove('open');
    compare.innerHTML = '';
  }
}

document.getElementById('galleryCloseBtn').addEventListener('click', () => {
  document.getElementById('galleryModal').classList.remove('open');
});
document.getElementById('galleryModal').addEventListener('click', (e) => {
  if (e.target.id === 'galleryModal') {
    document.getElementById('galleryModal').classList.remove('open');
  }
});

// ---- Mobile bottom sheet ----
function openBottomSheet(html) {
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('bottomSheet').classList.add('open');
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeBottomSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}

document.getElementById('sheetCloseBtn').addEventListener('click', closeBottomSheet);
document.getElementById('sheetBackdrop').addEventListener('click', closeBottomSheet);

// Swipe-down-to-dismiss on the handle
(function() {
  const sheet = document.getElementById('bottomSheet');
  const handle = document.getElementById('sheetHandle');
  let startY = null;
  let currentTranslate = 0;

  function onStart(y) {
    startY = y;
    sheet.style.transition = 'none';
  }
  function onMove(y) {
    if (startY === null) return;
    const delta = y - startY;
    if (delta > 0) {
      currentTranslate = delta;
      sheet.style.transform = `translateY(${delta}px)`;
    }
  }
  function onEnd() {
    sheet.style.transition = '';
    if (currentTranslate > 90) {
      closeBottomSheet();
    }
    sheet.style.transform = '';
    startY = null;
    currentTranslate = 0;
  }

  handle.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true });
  handle.addEventListener('touchmove', (e) => onMove(e.touches[0].clientY), { passive: true });
  handle.addEventListener('touchend', onEnd);
})();

document.getElementById('searchBtn').addEventListener('click', jumpToPlant);
document.getElementById('searchBox').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') jumpToPlant();
});

// Mobile search toggle
const searchToggleBtn = document.getElementById('searchToggleBtn');
const searchWrap = document.getElementById('searchWrap');
if (searchToggleBtn) {
  searchToggleBtn.addEventListener('click', () => {
    searchWrap.classList.toggle('open');
    if (searchWrap.classList.contains('open')) {
      document.getElementById('searchBox').focus();
    }
  });
}

// Collapsible legend (mobile)
const legendToggle = document.getElementById('legendToggle');
const legendBody = document.getElementById('legendBody');
const legendChevron = document.getElementById('legendChevron');
if (legendToggle) {
  legendToggle.addEventListener('click', () => {
    legendBody.classList.toggle('open');
    legendChevron.textContent = legendBody.classList.contains('open') ? '▴' : '▾';
  });
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
loadData();
